services:
  agent:
    build: .
    image: legal-reels-agent:local
    env_file:
      - .env
    volumes:
      - ./drafts:/app/drafts
      - ./data:/app/data
      - ./audio:/app/audio
      - ./renders:/app/renders
      - ./templates:/app/templates:ro
      - ./backgrounds:/app/backgrounds:ro
    restart: "no"
