name: Daily TOP-5 selection

# Diagnostic workflow only. Production daily execution is owned by
# daily-publisher.yml so TOP-5 selection is not run twice every day.
on:
  workflow_dispatch:

jobs:
  top5:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Select TOP-5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemma-4-26b-a4b-it:free
        run: python -m app.daily_selection
      - name: Upload TOP-5 result
        uses: actions/upload-artifact@v4
        with:
          name: latest-top5
          path: data/latest_top5.json
          retention-days: 7
