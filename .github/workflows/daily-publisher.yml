name: Daily Robotics Publisher

on:
  workflow_dispatch:
  schedule:
    # 09:00 Moscow/Helsinki summer time (UTC+3).
    - cron: "0 6 * * *"

# Never allow two publication runs to overlap. A newer manual run waits for
# the active run instead of creating a second article/post concurrently.
concurrency:
  group: robotics-daily-publisher
  cancel-in-progress: false

# The publisher only needs to read the repository and push the generated
# article/top-5 state back to main. Keep the default token scope minimal.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Run tests
        run: |
          pytest -q

      - name: Validate publication configuration
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: |
          if [ -z "${VK_ACCESS_TOKEN:-}" ] && [ -z "${VK_TOKEN:-}" ]; then
            echo "❌ VK access token secret is missing"
            exit 1
          fi
          if [ -z "${VK_GROUP_ID:-}" ]; then
            echo "❌ VK group ID secret is missing"
            exit 1
          fi
          case "${VK_GROUP_ID}" in
            ''|*[!0-9]*)
              echo "❌ VK_GROUP_ID must contain digits only"
              exit 1
              ;;
          esac
          echo "✅ VK publication configuration is present"

      - name: Run agent
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_PUBLISH_REQUIRED: "true"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Use a deterministic free model. openrouter/free may route a
          # request to an unsuitable free endpoint (including guardrail
          # models), which can return text such as "User Safety: safe"
          # instead of the requested article JSON.
          OPENROUTER_MODEL: google/gemma-4-31b-it:free
        run: |
          python main.py

      - name: Save generated article
        run: |
          git status --short

          git config --global user.name "robotics-agent"
          git config --global user.email "agent@github.com"

          # Commit only intended runtime outputs. Never add caches, local
          # environment files, or other runner artifacts to the repository.
          git add articles/ data/latest_top5.json
          git diff --cached --quiet || git commit -m "Generate daily robotics article"
          git push
