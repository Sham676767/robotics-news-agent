name: Daily Robotics Publisher

on:
  workflow_dispatch:
  schedule:
    # 09:00 Moscow/Helsinki summer time (UTC+3).
    - cron: "0 6 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Run tests
        run: |
          pytest -q

      - name: Validate publication configuration
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: |
          if [ -z "${VK_ACCESS_TOKEN:-}" ] && [ -z "${VK_TOKEN:-}" ]; then
            echo "❌ VK access token secret is missing"
            exit 1
          fi
          if [ -z "${VK_GROUP_ID:-}" ]; then
            echo "❌ VK group ID secret is missing"
            exit 1
          fi
          case "${VK_GROUP_ID}" in
            ''|*[!0-9]*)
              echo "❌ VK_GROUP_ID must contain digits only"
              exit 1
              ;;
          esac
          echo "✅ VK publication configuration is present"

      - name: Run agent
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_PUBLISH_REQUIRED: "true"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
        run: |
          python main.py

      - name: Save generated article
        run: |
          git status
          ls -la

          git config --global user.name "robotics-agent"
          git config --global user.email "agent@github.com"

          git add .
          git commit -m "Generate daily robotics article" || echo "Nothing to commit"
          git push
