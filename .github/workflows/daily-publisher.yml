name: Daily Robotics Publisher

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - name: Run tests
        run: |
          pytest -q

      - name: Run agent
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: google/gemma-4-31b-it:free
        run: |
          python main.py

      - name: Save generated article
        run: |
          git status
          ls -la

          git config --global user.name "robotics-agent"
          git config --global user.email "agent@github.com"

          git add .
          git commit -m "Generate daily robotics article" || echo "Nothing to commit"
          git push
