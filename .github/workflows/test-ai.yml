name: Test AI ranking

on:
  workflow_dispatch:

jobs:
  ai-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Trust GigaChat root certificate
        run: |
          curl -kfsSL "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt" -o /tmp/russian_trusted_root_ca.pem
          cat /tmp/russian_trusted_root_ca.pem >> "$(python -m certifi)"

      - name: Run GigaChat smoke test
        env:
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
        run: python -m app.ai_smoke_test
