name: Preview validated images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Run validated image preview
        run: python -m app.preview_images_v2

      - name: Commit preview artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/preview_images_v2.md data/latest_top5_images_v2.json
          git diff --cached --quiet || git commit -m "Update validated image preview"
          git push
