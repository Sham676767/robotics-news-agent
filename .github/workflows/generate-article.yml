name: Generate article draft

# Manual editorial QA workflow. Production daily execution is owned by
# daily-publisher.yml; this workflow intentionally has no schedule.
on:
  workflow_dispatch:

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Trust GigaChat root certificate
        run: |
          curl -kfsSL "https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt" -o /tmp/russian_trusted_root_ca.pem
          cat /tmp/russian_trusted_root_ca.pem >> "$(python -m certifi)"

      - name: Select fresh TOP-5
        env:
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
          GIGACHAT_MODEL: GigaChat
        run: python -m app.daily_selection
      - name: Generate article draft
        env:
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
          GIGACHAT_MODEL: GigaChat
        run: python -m app.article_editor
      - name: Upload draft and TOP-5
        uses: actions/upload-artifact@v4
        with:
          name: article-draft
          path: |
            data/latest_top5.json
            articles/*.md
          retention-days: 14
