name: Generate article draft

on:
  workflow_dispatch:

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Select fresh TOP-5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
        run: python -m app.daily_selection
      - name: Generate article draft
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
        run: python -m app.article_editor
      - name: Upload draft and TOP-5
        uses: actions/upload-artifact@v4
        with:
          name: article-draft
          path: |
            data/latest_top5.json
            data/article_draft.md
          retention-days: 14
