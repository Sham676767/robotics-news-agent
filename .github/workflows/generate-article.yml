name: Generate article draft

# Manual editorial QA workflow. Production daily execution is owned by
# daily-publisher.yml; this workflow intentionally has no schedule.
on:
  workflow_dispatch:

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Select fresh TOP-5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: z-ai/glm-5.3-flash
        run: python -m app.daily_selection
      - name: Find source images
        run: python -m app.image_fetcher
      - name: Generate article draft
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: z-ai/glm-5.3-flash
          OPENROUTER_ARTICLE_MODEL: openai/gpt-4.1-mini
        run: python -m app.article_editor
      - name: Upload draft and TOP-5
        uses: actions/upload-artifact@v4
        with:
          name: article-draft
          path: |
            data/latest_top5.json
            articles/*.md
          retention-days: 14
